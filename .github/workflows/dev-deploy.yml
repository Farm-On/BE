name: Java CI/CD with Gradle and Docker

# event trigger
on:
  push:
    branches:
      - ci/cd
      - develop
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      ## JDK 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      ## 환경별 YML 파일 생성
      - name: Make application-dev.yml
        run: |
          if [ ! -d "src/main/resources" ]; then
            mkdir -p src/main/resources
          fi
          echo "${{ secrets.APPLICATION_DEV_YML }}" > src/main/resources/application-dev.yml
        shell: bash

      ## `.env` 파일 생성
      - name: Create .env file
        run: |
          echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" > .env
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> .env
          echo "DOCKER_REPO=${{ secrets.DOCKER_REPO }}" >> .env
        shell: bash

      ## Gradlew 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      ## Gradle 빌드
      - name: Build Gradle
        run: ./gradlew clean build

      ## Docker 빌드 & 푸시
      - name: Docker build & push to Docker Hub
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -f Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      ## docker-compose.yml을 EC2로 복사
      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.KEY }}
          source: "docker-compose.yml"
          target: "/home/ubuntu/"

      ## EC2에서 배포 스크립트 실행
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        id: deploy
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.KEY }}
          script: |
            # Docker 로그인
            sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}"

            # 기존 컨테이너 중지 및 삭제
            if [ -n "$(sudo docker ps -aq)" ]; then
              sudo docker rm -f $(sudo docker ps -aq)
            fi

            # 최신 Docker 이미지 가져오기
            sudo docker pull "${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:latest"

            # 최신 `.env` 파일을 EC2 서버에 생성
            echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" > /home/ubuntu/.env
            echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> /home/ubuntu/.env
            echo "DOCKER_REPO=${{ secrets.DOCKER_REPO }}" >> /home/ubuntu/.env

            # 최신 `docker-compose.yml`로 컨테이너 실행
            docker-compose -f /home/ubuntu/docker-compose.yml up -d --remove-orphans

            # 모든 컨테이너를 `app-network`에 연결
            if [ "$(sudo docker ps -q)" ]; then
              for container_id in $(sudo docker ps -q); do
                sudo docker network connect app-network $container_id || echo "Container $container_id is already connected to app-network"
              done
            fi

            # 사용하지 않는 Docker 이미지 정리
            sudo docker image prune -f
